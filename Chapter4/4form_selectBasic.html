<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>Document</title>
</head>
<body>
    <h2>한 항목만 선택하기</h2>
    <select>
        <option>메뉴선택</option>
        <option>김밥</option>
        <option>떡볶이</option>
        <option>어묵</option>
    </select>

    <h2>여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>메뉴선택</option>
        <option>김밥</option>
        <option>떡볶이</option>
        <option>어묵</option>
    </select>
</body>
</html>
