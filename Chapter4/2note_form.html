<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
    <form>
        <table border="1">
            <tr>
                <td><label for="name">이름</label></td>
                <td><input id="name" text="name"></td>
            </tr>

            <tr>
                <td>성별</td>

                    <label for="woman">여성</label>
                </td>
            </tr>
        </table>
        <input type="submit" value="가입">
    </form>    
</body>
</html>
